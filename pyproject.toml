[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goal-agent"
version = "0.1.0"
description = "AGA — Adaptive Goal Agent: persistent AI agent that turns goals into smart, self-correcting plans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
aga = "goal_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
